name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # An explicit Ubuntu release, so image upgrades are a deliberate change here
        # (ubuntu-latest moves from 24.04 to 26.04 between 2026-10-19 and 11-19).
        os: [ubuntu-26.04, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Software GPU adapters for the wgpu parity tests: lavapipe (Vulkan, Mesa) on Linux; Windows
      # runners already have WARP (DX12).
      - name: Install lavapipe
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo fmt --all --check
      # cfd-cli enables the `cuda` feature by default, so the workspace build includes the CUDA
      # backend: cudarc loads the CUDA libraries at runtime, so no toolkit is needed to build it.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The build without CUDA must keep working too.
      - run: cargo clippy -p cfd-cli -p cfd-cuda --all-targets --no-default-features -- -D warnings
      # Includes the checks that schema/ and scenes/ match the Rust code, and the CPU <-> wgpu
      # parity tests (CFD_REQUIRE_GPU: fail rather than skip when no adapter is found). The CUDA
      # tests skip: there is no NVIDIA GPU here (see the `cuda-kernels` job for NVRTC).
      - run: cargo test --workspace
        env:
          CFD_REQUIRE_GPU: "1"

  cuda-kernels:
    name: CUDA kernels (NVRTC, no GPU)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Only the CUDA runtime compiler (no driver, no GPU): enough to compile every kernel and
      # check the generated static_asserts on the Params/BcParams layouts against Rust.
      - name: Install NVRTC
        run: |
          # NVIDIA's repository for this image's release (ubuntu2604 on ubuntu-26.04).
          repo="ubuntu$(. /etc/os-release && echo "${VERSION_ID//./}")"
          wget -q "https://developer.download.nvidia.com/compute/cuda/repos/$repo/x86_64/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update && sudo apt-get install -y cuda-nvrtc-13-4
          echo "LD_LIBRARY_PATH=$(dirname "$(find /usr/local -name 'libnvrtc.so.13*' | head -1)")" >> "$GITHUB_ENV"
      - run: cargo test -p cfd-cuda --features cuda
        env:
          CFD_REQUIRE_NVRTC: "1"

  verify:
    name: Validation suite (quick)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Physics validation on the CPU backend at reduced resolution (docs/08-validation-guide.md);
      # fails if any case is outside its tolerance. The full suite runs locally (`--full`).
      - run: cargo run --release -p cfd-cli -- verify --quick --backend cpu --report target/verify-report
      # The same subset on the wgpu backend, on lavapipe (a software Vulkan adapter).
      - name: Install lavapipe
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo run --release -p cfd-cli -- verify --quick --backend wgpu --allow-software --report target/verify-report-wgpu
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verify-report
          path: |
            target/verify-report
            target/verify-report-wgpu

  web:
    name: Web
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Generated types are up to date
        run: npm run gen:types && git diff --exit-code -- src/generated
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  web-e2e:
    name: Web end-to-end (Playwright)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # The server the tests talk to; no GPU here, so `auto` runs jobs on the CPU engine.
      - run: cargo build --release -p cfd-server
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # The web app embedded in the server binary (`--features web`): the release build the
      # users get (docs/development.md). The Rust job does not build it (no Node there).
      - run: npm run build
        working-directory: apps/web
      - run: cargo test --release -p cfd-server --features web --test web
      # The Phase 4 acceptance scenario: draw the cylinder in a channel, validate, run it.
      - run: npm run test:e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
