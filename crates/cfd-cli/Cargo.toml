[package]
name = "cfd-cli"
description = "Command-line tool for live-fluids: scenes, headless runs, benchmarks and validation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "cfd-cli"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
cfd-core.workspace = true
cfd-cuda.workspace = true
cfd-gpu.workspace = true
cfd-io.workspace = true
cfd-lbm.workspace = true
cfd-verify.workspace = true
clap.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
# The CUDA backend builds without the CUDA Toolkit (its libraries are loaded at runtime), so it
# is on by default; `--no-default-features` leaves it out.
default = ["cuda"]
cuda = ["cfd-cuda/cuda"]

[lints]
workspace = true
