[package]
name = "cfd-cuda"
description = "CUDA backend for the cfd-flux solvers (enabled with the `cuda` feature)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
cfd-core.workspace = true
bytemuck.workspace = true
cfd-lbm.workspace = true
cudarc = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
cfd-verify.workspace = true

[features]
# Enables the CUDA backend. It builds without the CUDA Toolkit (the libraries are loaded at
# runtime); running it needs an NVIDIA driver >= 13.0 and the CUDA 13 NVRTC library.
cuda = ["dep:cudarc", "dep:libloading"]

[lints]
workspace = true
