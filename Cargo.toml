[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Joaodss/cfd-flux"
rust-version = "1.87"

[workspace.dependencies]
cfd-core = { path = "crates/cfd-core" }
cfd-cuda = { path = "crates/cfd-cuda" }
cfd-engines = { path = "crates/cfd-engines" }
cfd-gpu = { path = "crates/cfd-gpu" }
cfd-io = { path = "crates/cfd-io" }
cfd-job = { path = "crates/cfd-job" }
cfd-lbm = { path = "crates/cfd-lbm" }
cfd-server = { path = "crates/cfd-server", default-features = false }
cfd-verify = { path = "crates/cfd-verify" }
anyhow = "1"
# Server (cfd-server): HTTP/WebSocket on tokio, SQLite through sqlx (bundled SQLite, queries checked
# at runtime, so no database is needed to build).
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytemuck = "1.25"
clap = { version = "4.5", features = ["derive"] }
# HTTP and WebSocket clients (`cfd-cli submit`, the server tests); no TLS: the server is local.
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite = "0.29"
# CUDA backend: dynamic loading (no toolkit needed to build) and the CUDA 13.0 bindings, so any
# 13.x driver works; the driver and NVRTC libraries are opened at runtime.
cudarc = { version = "0.19.10", default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "dynamic-loading",
    "cuda-13000",
] }
half = "2.4"
libloading = "0.9"
# Frame payloads (Q13): fast block compression; the `unsafe` encoder, the safe decoder.
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode", "checked-decode"] }
naga = { version = "30", features = ["wgsl-in"] }
png = "0.18"
pollster = "1"
rayon = "1.10"
# Serving the web app from the server binary (cfd-server, feature `web`) and opening the browser.
rust-embed = { version = "8", features = ["debug-embed", "mime-guess"] }
ruzstd = "0.8"
# Layers from the web editor (deflate+base64): pure Rust, already a dependency of png.
miniz_oxide = "0.8"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "net", "time"] }
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7"] }
webbrowser = "1"
wgpu = "30"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = "line-tables-only"
